<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <title>Visualizador 3D Tiles</title>
    <link
      href="https://cesium.com/downloads/cesiumjs/releases/1.147/Build/Cesium/Widgets/widgets.css"
      rel="stylesheet"
    >
    <script
      src="https://cesium.com/downloads/cesiumjs/releases/1.147/Build/Cesium/Cesium.js"
    ></script>
    <style>
    html,
    body,
    #cesiumContainer {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background-color: #000;
    }
    </style>
  </head>
  <body>
    <div id="cesiumContainer"></div>

    <script>
    const viewer = new Cesium.Viewer('cesiumContainer', {
      globe: false, // Sem globo: nem imagem de satélite nem terreno, só os prédios
      baseLayerPicker: false, // Não há mapa de fundo para trocar sem o globo
      geocoder: false, // A busca de endereços move a câmera até um globo que não existe
      timeline: false, // Remove barra de tempo inferior
      animation: false, // Remove controle de animação
    });

    async function carregarTileset() {
      try {
        const tileset = await Cesium.Cesium3DTileset.fromUrl('3dtiles/tileset.json');
        const centro = Cesium.Cartographic.fromCartesian(tileset.boundingSphere.center);
        const alturaChao = 762.98; // altura mínima da região do tileset.json
        const origem = Cesium.Cartesian3.fromRadians(centro.longitude, centro.latitude, 0);
        const destino = Cesium.Cartesian3.fromRadians(
          centro.longitude,
          centro.latitude,
          -alturaChao,
        );
        tileset.modelMatrix = Cesium.Matrix4.fromTranslation(
          Cesium.Cartesian3.subtract(destino, origem, new Cesium.Cartesian3()),
        );
        viewer.scene.primitives.add(tileset);

        // Voa a câmera diretamente para a posição dos prédios
        await viewer.zoomTo(tileset);

        mostrarAtributosAoClicar(tileset);
      } catch (error) {
        console.error('Erro ao carregar o 3D Tiles:', error);
      }
    }

    // Rótulos dos atributos gravados pelo pg2b3dm (veja sql/building_tiles.sql), na ordem exibida.
    const ATRIBUTOS = {
      predio_name: 'Prédio',
      predio_number: 'Número',
      cd_identificador: 'GeoSampa',
      height_m: 'Altura (m)',
    };

    function escaparHtml(texto) {
      const div = document.createElement('div');
      div.textContent = texto;
      return div.innerHTML;
    }

    // Ao clicar num prédio, destaca-o e mostra seus atributos no InfoBox do Cesium.
    function mostrarAtributosAoClicar(tileset) {
      const destaque = { feature: undefined, cor: new Cesium.Color() };
      const selecionado = new Cesium.Entity();
      const handler = viewer.screenSpaceEventHandler;

      handler.setInputAction((clique) => {
        if (Cesium.defined(destaque.feature)) {
          destaque.feature.color = destaque.cor;
          destaque.feature = undefined;
        }

        const feature = viewer.scene.pick(clique.position);
        if (!(feature instanceof Cesium.Cesium3DTileFeature) || feature.tileset !== tileset) {
          viewer.selectedEntity = undefined;
          return;
        }

        destaque.feature = feature;
        Cesium.Color.clone(feature.color, destaque.cor);
        feature.color = Cesium.Color.YELLOW;

        const linhas = Object.entries(ATRIBUTOS)
          .filter(([id]) => feature.hasProperty(id))
          .map(([id, rotulo]) => [rotulo, feature.getProperty(id)])
          .filter(([, valor]) => valor !== undefined && valor !== null && valor !== '')
          .map(([rotulo, valor]) =>
            `<tr><th>${escaparHtml(rotulo)}</th><td>${escaparHtml(String(valor))}</td></tr>`)
          .join('');

        selecionado.name = feature.getProperty('predio_name')
          || `Edificação ${feature.getProperty('cd_identificador')}`;
        selecionado.description = `<table class="cesium-infoBox-defaultTable"><tbody>${linhas}</tbody></table>`;
        viewer.selectedEntity = selecionado;
      }, Cesium.ScreenSpaceEventType.LEFT_CLICK);
    }

    carregarTileset();
    </script>
  </body>
</html>
