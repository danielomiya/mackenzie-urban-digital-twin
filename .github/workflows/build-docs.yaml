---
name: Docs PDF

"on":
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/build-docs.yaml"
  pull_request:
    types: [opened, synchronize, reopened, closed]
    paths:
      - "docs/**"
      - ".github/workflows/build-docs.yaml"

permissions: {}

concurrency:
  group: docs-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PDF_NAME: main.pdf
  RELEASE_TAG: latest-docs

jobs:
  build:
    name: Build docs PDF
    if: github.event_name == 'push' || github.event.action != 'closed'
    runs-on: ubuntu-latest
    permissions:
      contents: write  # create/delete releases and tags
      pull-requests: write  # post and minimize PR comments
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Compile LaTeX
        id: latex
        continue-on-error: true
        uses: xu-cheng/latex-action@6549dc21effb2730855a1281407ecfcececc6c1b  # v4
        with:
          working_directory: docs
          root_file: main.tex

      - name: Publish rolling release
        if: github.event_name == 'push' && steps.latex.outcome == 'success'
        run: |
          gh release delete "$RELEASE_TAG" --cleanup-tag --yes || true
          gh release create "$RELEASE_TAG" "docs/$PDF_NAME" \
            --target "$GITHUB_SHA" \
            --title "Docs (latest)" \
            --notes "Compiled from ${GITHUB_SHA::7}." \
            --latest

      - name: Upload PDF to PR prerelease
        if: github.event_name == 'pull_request' && steps.latex.outcome == 'success'
        env:
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          tag="pr-$PR"
          asset="main-${HEAD_SHA::7}.pdf"
          cp "docs/$PDF_NAME" "$asset"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" \
              --prerelease --latest=false \
              --target "$HEAD_SHA" \
              --title "Docs preview — PR #$PR" \
              --notes "Temporary PDF builds for #$PR. Deleted automatically when the PR is closed."
          fi
          gh release upload "$tag" "$asset" --clobber

      - name: Comment on PR (minimize previous ones)
        if: github.event_name == 'pull_request' && !cancelled()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0
        env:
          LATEX_OUTCOME: ${{ steps.latex.outcome }}
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- docs-pdf-build -->';
            const { owner, repo } = context.repo;
            const pr = context.payload.pull_request.number;
            const sha = context.payload.pull_request.head.sha.slice(0, 7);

            // Collapse earlier bot comments as "outdated"
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number: pr, per_page: 100,
            });
            for (const c of comments) {
              if (c.user.type === 'Bot' && c.body.includes(marker)) {
                await github.graphql(
                  `mutation($id: ID!) {
                     minimizeComment(input: { subjectId: $id, classifier: OUTDATED }) { clientMutationId }
                   }`,
                  { id: c.node_id },
                );
              }
            }

            let body;
            if (process.env.LATEX_OUTCOME === 'success') {
              const url = `${context.serverUrl}/${owner}/${repo}/releases/download/pr-${pr}/main-${sha}.pdf`;
              body = [
                marker,
                '### 📄 Docs compiled',
                `**Commit:** \`${sha}\``,
                '',
                `[⬇️ Download main-${sha}.pdf](${url})`,
              ].join('\n');
            } else {
              let log = 'docs/main.log not found (compilation may have failed before LaTeX ran).';
              try {
                const lines = fs.readFileSync('docs/main.log', 'utf8').split('\n');
                const i = lines.findIndex(l => l.startsWith('!') || /:\d+: /.test(l));
                log = (i >= 0 ? lines.slice(i, i + 20) : lines.slice(-40)).join('\n');
              } catch {}
              const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
              body = [
                marker,
                '### ❌ Docs failed to compile',
                `**Commit:** \`${sha}\` · [full run log](${runUrl})`,
                '',
                '<details><summary>LaTeX error</summary>',
                '',
                '```text',
                log,
                '```',
                '</details>',
              ].join('\n');
            }

            await github.rest.issues.createComment({ owner, repo, issue_number: pr, body });

      - name: Fail job if compilation failed
        if: steps.latex.outcome == 'failure'
        run: exit 1

  cleanup:
    name: Clean up PR preview
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    permissions:
      contents: write  # delete the PR prerelease and its tag
    steps:
      - name: Delete PR prerelease and its tag
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          gh release delete "pr-$PR" --cleanup-tag --yes \
            || echo "No prerelease to clean up."
